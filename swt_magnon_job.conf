# Four-band SWT magnon-dispersion maps over the (111) kagome-plane BZ.
# Edit these settings, then submit with ./queue_swt_magnon.sh.
# Each PDF uses phi = 0.1 or 30.1 degrees and contains rows for
# mu_B |B| / J_zz = 0.25, 0.45, 1.5 with columns for the four magnon bands.
RUN_LABEL="run_01"
J_PM_RATIO=0.20
J_PMPM_RATIO=0.0
# Eq. (1) field constants; delta values are in inverse meV.
G_Z=10.0
G_PERP=0.0
DELTA1_PER_MEV=0.7142857142857143
DELTA2_PER_MEV=0.7142857142857143
J_ZZ_EV=0.0002
