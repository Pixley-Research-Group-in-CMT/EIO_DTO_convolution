# Fixed-energy SWT spin-structure-factor scan.
# Edit these settings, then submit with ./queue_swt_ssf.sh.
# The job always evaluates phi = 0.1, 30.1 degrees and
# h/J_zz = 0.25, 0.45, 1.5.
RUN_LABEL="run_15"
J_PM_RATIO=0.20
J_PMPM_RATIO=0.0
J_ZZ_EV=0.0002

# COMPONENT: total, bragg, one_magnon, or two_magnon.
# VMAX_PERCENTILE sets the common color-scale upper limit.
COMPONENT="total"
VMAX_PERCENTILE=99

# Perpendicular momentum: "slice" keeps q_perp=0; "integrated" averages the
# bulk response over N_Q_PERP points spanning one [111] reciprocal period.
Q_PERP_MODE="slice"
N_Q_PERP=8
