# Omega-integrated SWT kernel, Eq. (24): side-by-side PDF or field movie.
# Submit with ./queue_swt_kernel.sh.
# Output: $HOME/SWT/kernel/$RUN_LABEL/{data,figures,movies,source}
RUN_LABEL="run_09"
# side_by_side: 3 field rows x 2 phi columns in one vector PDF.
# movie: 1 row x 2 phi columns animated over field.
PLOT_MODE="movie"
# Used only in side_by_side mode, in left-to-right order.
FIELDS=(0.02 0.045 0.12)
EIO_MODEL="symmetrized"  # original or symmetrized
# Movie only: bare field energy mu_B |B| / J_zz; endpoints included.
MU_B_B_START=0.02
MU_B_B_STOP=0.12
N_FIELD_FRAMES=50
# Field orientation: theta=90 degrees; phi is measured in the interface plane.
FIELD_PHIS_DEGREES=(0 30)
# Both exact angles appear together in the same PDF or movie.
J_PM_RATIO=0.20
J_PMPM_RATIO=0.0
G_Z=10.0
G_PERP=0.0
DELTA1_PER_MEV=0.0
DELTA2_PER_MEV=0.0
J_ZZ_EV=0.00017
# Always total = one_magnon + two_magnon, summed over all incoming states.
# Elastic Bragg scattering is excluded.
ETA_MEV=0.02
DSSF_NK=8
Q_PERP_MODE="integrated"
N_Q_PERP=8
LATTICE_CONSTANT=10.154
SPIN_LENGTH=0.5
REGULARIZATION=1e-8
STABILITY_TILT=0.01
RANDOM_STARTS=8
# PDF: shared scale across all panels. Movie: independent scale per frame,
# shared between the two phi panels in that frame.
VMAX_PERCENTILE=100
MARKER_SIZE=20
FPS=10
VIDEO_FORMAT="gif"  # mp4 requires ffmpeg or imageio-ffmpeg
DPI=120
