# Energy-resolved SWT DSSF along Gamma-X-W-K-Gamma-L-U.
# Edit these settings, then submit with ./queue_swt_path.sh.
# The job writes two PDFs for each angle, with one row per value in FIELDS.
RUN_LABEL="run_02"
FIELDS=(0.25 0.45 1.5)
FIELD_PHIS_DEGREES=(0.1 30.1)

J_PM_RATIO=0.20
J_PMPM_RATIO=0.0
J_ZZ_EV=0.0002

# COMPONENT: total, bragg, one_magnon, or two_magnon.
# VMAX_PERCENTILE sets one shared scale across all panels in each PDF.
COMPONENT="total"
VMAX_PERCENTILE=99

# Numerical resolution. total and two_magnon are the most expensive choices.
POINTS_PER_SEGMENT=40
N_OMEGA=200
ETA_MEV=0.02
DSSF_NK=8
OMEGA_CHUNK_SIZE=8
