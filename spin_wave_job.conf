# EIO/TTO Sec. 4.2 spin-wave SLURM configuration
#
# Edit this file, then submit with:
#     ./queue_swt.sh
#
# Field values are dimensionless h/J_zz ratios.  The angle scan is generated
# internally; no gMFT result files are required.
FIELDS=(0.46 0.47 0.48)

# Field direction in the paper's angular convention.
FIELD_THETA_DEGREES=90
# Evaluate each nominal angle at phi + PHI_OFFSET_DEGREES. Plots and output
# coordinates retain the nominal values 0, 2, ..., 180 degrees.
PHI_OFFSET_DEGREES=0.1
PHI_START_DEGREES=0
PHI_STOP_DEGREES=180
N_PHI=91

# Evaluate only phi >= 0, then copy each transport result to -phi. This writes
# 181 output angles from -180 through 180 while computing only 91 DSSF points.
REFLECT_NEGATIVE_PHI=true

# Short name for this submission.  It becomes the first part of the result
# directory name.  Use letters, numbers, periods, underscores, or hyphens.
RUN_LABEL="run_254"

# Model and numerical constants.
J_PM_RATIO=0.20
J_PMPM_RATIO=0.0
J_ZZ_EV=0.00017
ETA_EV=0.00002
DSSF_NK=8
# Choose "slice" for S(q_parallel, q_perp=0, omega), or "integrated" for
# the kagome-layer response averaged over one [111] reciprocal period.
Q_PERP_MODE="slice"
N_Q_PERP=8
STABILITY_TILT=0.01

# Output location on the cluster.
RESULT_ROOT="$HOME/SWT_transport"

# Python environment used on the cluster.
PYTHON_MODULE="python/3.8.2"
PYTHON_ENV_ACTIVATE="$HOME/eio_tto_env/bin/activate"
PYTHON_BIN="python3"
