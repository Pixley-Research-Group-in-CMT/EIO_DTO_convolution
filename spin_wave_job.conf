# EIO/TTO Sec. 4.2 spin-wave SLURM configuration
#
# Edit this file, then submit with:
#     ./queue_swt.sh
#
# Field values are the bare Zeeman energies mu_B |B| / J_zz.  The g factors
# and delta couplings below are applied after projection onto local axes.
FIELDS=(0.05 0.1 0.25 0.5)

# Field direction in the paper's angular convention.
FIELD_THETA_DEGREES=90
# Evaluate each nominal angle at phi + PHI_OFFSET_DEGREES. Plots and output
# coordinates retain the nominal values 0, 2, ..., 180 degrees.
PHI_OFFSET_DEGREES=0.1
PHI_START_DEGREES=0
PHI_STOP_DEGREES=30
N_PHI=31

# Evaluate only phi >= 0, then copy each transport result to -phi. This writes
# 181 output angles from -180 through 180 while computing only 91 DSSF points.
REFLECT_NEGATIVE_PHI=true

# Short name for this submission.  It becomes the first part of the result
# directory name.  Use letters, numbers, periods, underscores, or hyphens.
RUN_LABEL="run_11"

# Model and numerical constants.
J_PM_RATIO=0.2
J_PMPM_RATIO=-0.2
# Eq. (1) field constants.  The note gives g_z approximately 10, g_perp < 1,
# and only the approximate scale |delta_1,2| ~ (1.4 meV)^-1.  Edit the signs
# and precise values here when they are known.  The conservative default
# G_PERP=0 does not invent a value that the note leaves unspecified.
G_Z=10.0
G_PERP=0.0
DELTA1_PER_MEV=0.2
DELTA2_PER_MEV=0.2
# Inelastic response used by transport: "one_magnon" (all four bands),
# "one_magnon_1" through "one_magnon_4" (lowest through highest band),
# "two_magnon", or "total". total = one_magnon + two_magnon; the elastic
# Bragg contribution is always excluded.
TRANSPORT_COMPONENT="total"
J_ZZ_EV=0.00017
ETA_EV=0.00002
DSSF_NK=8
# Choose "slice" for S(q_parallel, q_perp=0, omega), or "integrated" for
# the kagome-layer response averaged over one [111] reciprocal period.
Q_PERP_MODE="integrated"
N_Q_PERP=8
STABILITY_TILT=0.01

# Output location on the cluster.
RESULT_ROOT="$HOME/SWT_transport_q"

# Python environment used on the cluster.
PYTHON_MODULE="python/3.8.2"
PYTHON_ENV_ACTIVATE="$HOME/eio_tto_env/bin/activate"
PYTHON_BIN="python3"
