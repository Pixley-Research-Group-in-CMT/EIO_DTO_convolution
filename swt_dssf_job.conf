# Energy-resolved SWT dynamic-structure-factor animation.
# Edit these settings, then submit with ./queue_swt_dssf.sh.
# Each video uses phi = 0.1 or 30.1 degrees and contains rows for
# mu_B |B| / J_zz = 0.25, 0.45, 1.5 with columns mu = 1, 2, 3.
RUN_LABEL="run_06"
J_PM_RATIO=0.20
J_PMPM_RATIO=0.0
# Eq. (1) field constants; delta values are in inverse meV.
G_Z=10.0
G_PERP=0.0
DELTA1_PER_MEV=0.7142857142857143
DELTA2_PER_MEV=0.7142857142857143
J_ZZ_EV=0.0002

# COMPONENT: total, one_magnon, one_magnon_1 through one_magnon_4, or
# two_magnon. total = one_magnon + two_magnon; Bragg is always excluded.
# VMAX_PERCENTILE is shared across every frame and panel in each video.
COMPONENT="total"
VMAX_PERCENTILE=99

# GIF is portable and needs no extra cluster package. MP4 requires ffmpeg.
N_OMEGA_FRAMES=60
FPS=10
VIDEO_FORMAT="gif"
