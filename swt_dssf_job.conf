# Energy-resolved SWT dynamic-structure-factor animation.
# Edit these settings, then submit with ./queue_swt_dssf.sh.
# Each video uses phi = 0.1 or 30.1 degrees and contains rows for
# h/J_zz = 0.25, 0.45, 1.5 with columns mu = 1, 2, 3.
RUN_LABEL="run_06"
J_PM_RATIO=0.20
J_PMPM_RATIO=0.0
J_ZZ_EV=0.0002

# COMPONENT: total, bragg, one_magnon, or two_magnon.
# VMAX_PERCENTILE is shared across every frame and panel in each video.
COMPONENT="total"
VMAX_PERCENTILE=99

# GIF is portable and needs no extra cluster package. MP4 requires ffmpeg.
N_OMEGA_FRAMES=60
FPS=10
VIDEO_FORMAT="gif"
