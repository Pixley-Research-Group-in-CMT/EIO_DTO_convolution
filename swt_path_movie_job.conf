# Field-scan movie of the SWT DSSF along Gamma-X-W-K-Gamma-L-U.
# Edit these settings, then submit with ./queue_swt_path_movie.sh.
RUN_LABEL="run_02"

# Each movie includes both endpoints and N_FIELD_FRAMES equally spaced values
# of the bare field energy mu_B |B| / J_zz.
MU_B_B_START=0.1
MU_B_B_STOP=4
N_FIELD_FRAMES=41
FIELD_PHIS_DEGREES=(0.1 30.1)

J_PM_RATIO=0.20
J_PMPM_RATIO=0.0
# Eq. (1) field constants; delta values are in inverse meV.
G_Z=10.0
G_PERP=0.0
DELTA1_PER_MEV=0.7142857142857143
DELTA2_PER_MEV=0.7142857142857143
J_ZZ_EV=0.00017

# COMPONENT: total, one_magnon, one_magnon_1 through one_magnon_4, or
# two_magnon. total = one_magnon + two_magnon; Bragg is always excluded.
# VMAX_PERCENTILE fixes one color scale across every field frame in a movie.
COMPONENT="total"
VMAX_PERCENTILE=99

# Numerical resolution. total and two_magnon are the most expensive choices.
POINTS_PER_SEGMENT=40
N_OMEGA=200
ETA_MEV=0.02
DSSF_NK=8
OMEGA_CHUNK_SIZE=8

# GIF works without ffmpeg. MP4 requires ffmpeg or imageio-ffmpeg.
FPS=10
VIDEO_FORMAT="gif"
DPI=100
