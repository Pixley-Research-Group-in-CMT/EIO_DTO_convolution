# Energy-integrated SWT static spin-structure-factor scan.
# Edit these settings, then submit with ./queue_swt_sssf.sh.
# The job always evaluates phi = 0.1, 30.1 degrees and
# mu_B |B| / J_zz = 0.25, 0.45, 1.5.
RUN_LABEL="run_15"
J_PM_RATIO=0.20
J_PMPM_RATIO=0.0
# Eq. (1) field constants; delta values are in inverse meV.
G_Z=10.0
G_PERP=0.0
DELTA1_PER_MEV=0.7142857142857143
DELTA2_PER_MEV=0.7142857142857143
J_ZZ_EV=0.0002

# COMPONENT: total, one_magnon, one_magnon_1 through one_magnon_4, or
# two_magnon. total = one_magnon + two_magnon; Bragg is always excluded.
# VMAX_PERCENTILE sets the common color-scale upper limit.
COMPONENT="total"
VMAX_PERCENTILE=99

# Perpendicular momentum: "slice" keeps q_perp=0; "integrated" averages the
# bulk response over N_Q_PERP points spanning one [111] reciprocal period.
Q_PERP_MODE="slice"
N_Q_PERP=8
